[project]
name = "finz-local-connector"
version = "0.1.7"
description = "Connecteur local de Finz : lit vos banques sur votre machine et envoie le résultat à Finz."
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "woob @ https://gitlab.com/woob/woob/-/archive/70ac33dc5b2b399b498415e009121cbe9d426692/woob-70ac33dc5b2b399b498415e009121cbe9d426692.tar.gz",
  "keyring>=25",
  "cryptography>=43",
  "platformdirs>=4",
]

[project.scripts]
finz-local-connector = "finz_local_connector.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finz_local_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.metadata]
# woob : commit figé de la branche principale (aucune version publiée depuis 3.7, octobre 2024).
allow-direct-references = true
